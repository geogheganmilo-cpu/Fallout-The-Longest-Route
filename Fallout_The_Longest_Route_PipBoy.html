<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>R.N.C. Pip-Boy // NCR Field Terminal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=VT323&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
/* ============================================================
   TOKENS
   ============================================================ */
:root{
  --void:#040704;
  --case-hi:#3a4238;
  --case-mid:#232922;
  --case-lo:#0e120e;
  --screen-bg:#07130a;
  --screen-bg-2:#0a1c0f;
  --amber:#ffb238;
  --red:#ff5c4d;
  --blue-note:#6bd0ff;
  --font-display:'VT323', monospace;
  --font-body:'Share Tech Mono', 'Courier New', monospace;
  --radius-case:26px;
  --radius-screen:10px;

  /* Selectable UI theme (default: Green). Each body[data-theme] block below
     redeclares --phos* locally so they resolve against THAT block's own
     --theme values, rather than inheriting a value frozen at :root. */
  --theme-bright:#7BFFB5; --theme:#1BFF80; --theme-dim:#149951; --theme-dimmer:#0B5C30;
  --theme-glow-rgb:27,255,128;
  --phos:var(--theme);
  --phos-bright:var(--theme-bright);
  --phos-dim:var(--theme-dim);
  --phos-dimmer:var(--theme-dimmer);
  --phos-glow:rgba(var(--theme-glow-rgb),0.55);
}
body[data-theme="amber"]{
  --theme-bright:#FFDDA6; --theme:#FFB641; --theme-dim:#B8791E; --theme-dimmer:#6E4610;
  --theme-glow-rgb:255,182,65;
  --phos:var(--theme); --phos-bright:var(--theme-bright); --phos-dim:var(--theme-dim);
  --phos-dimmer:var(--theme-dimmer); --phos-glow:rgba(var(--theme-glow-rgb),0.55);
}
body[data-theme="green"]{
  --theme-bright:#7BFFB5; --theme:#1BFF80; --theme-dim:#149951; --theme-dimmer:#0B5C30;
  --theme-glow-rgb:27,255,128;
  --phos:var(--theme); --phos-bright:var(--theme-bright); --phos-dim:var(--theme-dim);
  --phos-dimmer:var(--theme-dimmer); --phos-glow:rgba(var(--theme-glow-rgb),0.55);
}
body[data-theme="white"]{
  --theme-bright:#FFFFFF; --theme:#C0FFFF; --theme-dim:#7FBFBF; --theme-dimmer:#456B6B;
  --theme-glow-rgb:192,255,255;
  --phos:var(--theme); --phos-bright:var(--theme-bright); --phos-dim:var(--theme-dim);
  --phos-dimmer:var(--theme-dimmer); --phos-glow:rgba(var(--theme-glow-rgb),0.55);
}
body[data-theme="blue"]{
  --theme-bright:#9EE9FF; --theme:#2ECFFF; --theme-dim:#1C8DB8; --theme-dimmer:#0F4E66;
  --theme-glow-rgb:46,207,255;
  --phos:var(--theme); --phos-bright:var(--theme-bright); --phos-dim:var(--theme-dim);
  --phos-dimmer:var(--theme-dimmer); --phos-glow:rgba(var(--theme-glow-rgb),0.55);
}
body[data-theme="red"]{
  --theme-bright:#FF8A8A; --theme:#FF0000; --theme-dim:#B00000; --theme-dimmer:#600000;
  --theme-glow-rgb:255,0,0;
  --phos:var(--theme); --phos-bright:var(--theme-bright); --phos-dim:var(--theme-dim);
  --phos-dimmer:var(--theme-dimmer); --phos-glow:rgba(var(--theme-glow-rgb),0.55);
}

*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  min-height:100vh;
  background:
    radial-gradient(ellipse at 50% -10%, #131a12 0%, var(--void) 55%);
  color:var(--phos);
  font-family:var(--font-body);
  display:flex;
  align-items:flex-start;
  justify-content:center;
  padding:18px 12px 60px;
}

/* ============================================================
   DEVICE CASE
   ============================================================ */
#device{
  width:100%;
  max-width:760px;
  background:
    linear-gradient(155deg, var(--case-hi) 0%, var(--case-mid) 35%, var(--case-lo) 100%);
  border-radius:var(--radius-case);
  padding:14px 14px 18px;
  box-shadow:
    0 0 0 1px #000,
    0 20px 60px rgba(0,0,0,0.7),
    inset 0 1px 0 rgba(255,255,255,0.05);
  position:relative;
}
#device::before{
  content:"";
  position:absolute;
  top:10px;left:22px;right:22px;
  height:10px;
  border-radius:6px;
  background:repeating-linear-gradient(90deg, #05070550 0 6px, transparent 6px 12px);
  opacity:0.5;
}
.case-label{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:6px 10px 10px;
  font-family:var(--font-body);
  font-size:10px;
  letter-spacing:2px;
  color:#5c6a58;
  text-transform:uppercase;
}
.case-label .rivet{
  width:6px;height:6px;border-radius:50%;
  background:radial-gradient(circle at 35% 35%, #6b7566, #14180f);
  box-shadow:0 1px 0 rgba(255,255,255,0.08);
}
.case-label-row{display:flex; align-items:center; gap:8px;}

/* ============================================================
   SCREEN
   ============================================================ */
#screen{
  background:radial-gradient(ellipse at 50% 0%, var(--screen-bg-2) 0%, var(--screen-bg) 70%);
  border-radius:var(--radius-screen);
  border:2px solid #01130a;
  box-shadow:
    inset 0 0 60px rgba(0,0,0,0.85),
    inset 0 0 18px rgba(0,0,0,0.9),
    0 0 24px rgba(var(--theme-glow-rgb),0.06);
  position:relative;
  overflow:hidden;
  min-height:70vh;
}
#screen::after{
  content:"";
  position:absolute; inset:0;
  pointer-events:none;
  background:
    repeating-linear-gradient(180deg, rgba(0,0,0,0.18) 0px, rgba(0,0,0,0.18) 1px, transparent 2px, transparent 3px),
    radial-gradient(ellipse at 50% 40%, transparent 55%, rgba(0,0,0,0.45) 100%);
  mix-blend-mode:multiply;
  animation:flicker 6s infinite steps(30);
}
@keyframes flicker{
  0%,100%{opacity:1;} 42%{opacity:0.97;} 43%{opacity:1;} 78%{opacity:0.985;} 79%{opacity:1;}
}
.crt-content{
  position:relative;
  z-index:1;
  text-shadow:0 0 6px var(--phos-glow), 0 0 1px var(--phos-glow);
  padding:14px 14px 90px;
}
::selection{background:var(--phos-dim); color:#04170a;}

/* scrollbars */
.scrollable::-webkit-scrollbar{width:8px; height:8px;}
.scrollable::-webkit-scrollbar-track{background:transparent;}
.scrollable::-webkit-scrollbar-thumb{background:var(--phos-dimmer); border-radius:4px;}

/* ============================================================
   TYPE
   ============================================================ */
h1,h2,h3,h4{font-family:var(--font-display); font-weight:400; margin:0; letter-spacing:1px;}
.num-display{font-family:var(--font-display);}
.small-caps{font-size:11px; letter-spacing:1.5px; text-transform:uppercase; color:var(--phos-dim);}
a{color:var(--phos);}

/* ============================================================
   HEADER / IDENTITY BAR
   ============================================================ */
#topbar{
  display:flex; align-items:center; justify-content:space-between;
  gap:10px; margin-bottom:10px; flex-wrap:wrap;
}
#charIdentity{
  display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; cursor:pointer;
  border:1px dashed var(--phos-dimmer); padding:6px 10px; border-radius:6px;
  background:rgba(var(--theme-glow-rgb),0.03);
}
#charIdentity:hover{background:rgba(var(--theme-glow-rgb),0.08);}
#charName{font-family:var(--font-display); font-size:30px; line-height:1; color:var(--phos-bright);}
#charMeta{font-size:12px; color:var(--phos-dim); letter-spacing:1px;}
.iconbtn{
  background:transparent; border:1px solid var(--phos-dimmer); color:var(--phos);
  font-family:var(--font-body); font-size:11px; letter-spacing:1px; text-transform:uppercase;
  padding:7px 10px; border-radius:6px; cursor:pointer; white-space:nowrap;
}
.iconbtn:hover{background:rgba(var(--theme-glow-rgb),0.1); border-color:var(--phos);}
.iconbtn:active{transform:translateY(1px);}
.iconbtn.primary{background:var(--phos-dimmer); border-color:var(--phos);}
.iconbtn.danger{border-color:var(--red); color:var(--red);}
.iconbtn.danger:hover{background:rgba(255,92,77,0.12);}
.iconbtn:disabled{opacity:0.35; cursor:not-allowed;}
#topbarActions{display:flex; gap:6px; flex-wrap:wrap; align-items:center;}
.theme-select{
  background:transparent; border:1px solid var(--phos-dimmer); color:var(--phos);
  font-family:var(--font-body); font-size:11px; letter-spacing:1px; text-transform:uppercase;
  padding:7px 8px; border-radius:6px; cursor:pointer;
}
.theme-select:hover{border-color:var(--phos);}
.theme-select option{background:#0c1611; color:var(--phos);}

/* ============================================================
   VITALS STRIP
   ============================================================ */
#vitals{
  display:grid;
  grid-template-columns:1.4fr 1fr 1fr;
  gap:8px;
  margin-bottom:12px;
}
.vital-box{
  border:1px solid var(--phos-dimmer);
  border-radius:6px;
  padding:8px 10px;
  background:rgba(var(--theme-glow-rgb),0.03);
}
.vital-label{font-size:10px; letter-spacing:1.5px; color:var(--phos-dim); text-transform:uppercase; display:flex; justify-content:space-between;}
.vital-value{font-family:var(--font-display); font-size:26px; line-height:1.1;}
.bar-track{height:8px; border:1px solid var(--phos-dimmer); border-radius:4px; margin-top:5px; overflow:hidden; background:rgba(0,0,0,0.4);}
.bar-fill{height:100%; background:linear-gradient(90deg, var(--phos-dim), var(--phos)); transition:width .25s;}
.bar-fill.warn{background:linear-gradient(90deg, #a67a1f, var(--amber));}
.bar-fill.crit{background:linear-gradient(90deg, #8a2c22, var(--red));}
.pip-row{display:flex; gap:4px; margin-top:5px; flex-wrap:wrap;}
.pip{width:14px; height:14px; border:1px solid var(--phos-dim); border-radius:50%; cursor:pointer;}
.pip.filled{background:var(--phos); box-shadow:0 0 6px var(--phos-glow);}
.stepper{display:flex; align-items:center; gap:6px;}
.stepper button{width:22px; height:22px; border-radius:4px; border:1px solid var(--phos-dim); background:transparent; color:var(--phos); font-family:var(--font-body); cursor:pointer; line-height:1;}
.stepper button:hover{background:rgba(var(--theme-glow-rgb),0.12);}

/* ============================================================
   TABS
   ============================================================ */
#tabnav{
  display:flex; gap:6px; margin-bottom:14px; border-bottom:1px solid var(--phos-dimmer); padding-bottom:0;
}
.tabbtn{
  flex:1;
  background:transparent; border:1px solid var(--phos-dimmer); border-bottom:none;
  color:var(--phos-dim); font-family:var(--font-display); font-size:20px; letter-spacing:3px;
  padding:8px 4px 6px; border-radius:6px 6px 0 0; cursor:pointer;
}
.tabbtn.active{color:var(--phos-bright); background:rgba(var(--theme-glow-rgb),0.08); border-color:var(--phos);
  box-shadow:0 0 10px rgba(var(--theme-glow-rgb),0.15) inset;}
.tabpanel{display:none; animation:fadein .15s ease;}
.tabpanel.active{display:block;}
@keyframes fadein{from{opacity:0;} to{opacity:1;}}

/* ============================================================
   SECTIONS / PANELS
   ============================================================ */
.panel{border:1px solid var(--phos-dimmer); border-radius:8px; padding:12px; margin-bottom:14px; background:rgba(var(--theme-glow-rgb),0.02);}
.panel-title{font-family:var(--font-display); font-size:20px; letter-spacing:2px; color:var(--phos-bright); margin-bottom:8px; display:flex; justify-content:space-between; align-items:center;}
.panel-title .hint{font-family:var(--font-body); font-size:10px; color:var(--phos-dim); text-transform:none; letter-spacing:0;}
.grid-special{display:grid; grid-template-columns:repeat(auto-fit, minmax(90px,1fr)); gap:8px;}
.special-card{border:1px solid var(--phos-dimmer); border-radius:6px; padding:8px; text-align:center; cursor:pointer; position:relative;}
.special-card:hover{background:rgba(var(--theme-glow-rgb),0.06);}
.special-card .abbr{font-size:11px; letter-spacing:2px; color:var(--phos-dim);}
.special-card .val{font-family:var(--font-display); font-size:34px; line-height:1;}
.special-card .name{font-size:10px; color:var(--phos-dim); text-transform:uppercase; letter-spacing:1px;}

.skill-row{
  display:grid; grid-template-columns:1fr auto auto auto auto; align-items:center; gap:8px;
  padding:6px 4px; border-bottom:1px solid rgba(60,138,68,0.35);
}
.skill-row:last-child{border-bottom:none;}
.skill-name{display:flex; align-items:center; gap:6px; font-size:14px;}
.tag-badge{font-size:9px; border:1px solid var(--amber); color:var(--amber); border-radius:3px; padding:1px 4px; letter-spacing:1px;}
.skill-attr{font-size:10px; color:var(--phos-dim); text-transform:uppercase; width:30px;}
.skill-rank-val{font-family:var(--font-display); font-size:22px; width:26px; text-align:center;}
.skill-tn{font-size:11px; color:var(--phos-dim); width:70px; text-align:right;}
.rollbtn{background:transparent; border:1px solid var(--phos); color:var(--phos); font-family:var(--font-body); font-size:11px; letter-spacing:1px; padding:4px 9px; border-radius:5px; cursor:pointer;}
.rollbtn:hover{background:var(--phos); color:#04170a;}

.derived-grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(120px,1fr)); gap:8px;}
.derived-box{border:1px solid var(--phos-dimmer); border-radius:6px; padding:8px 10px;}
.derived-box .lbl{font-size:10px; color:var(--phos-dim); text-transform:uppercase; letter-spacing:1px;}
.derived-box .val{font-family:var(--font-display); font-size:24px;}
.derived-box .sub{font-size:10px; color:var(--phos-dim);}

textarea, input[type=text], input[type=number], select{
  background:rgba(0,0,0,0.35); border:1px solid var(--phos-dimmer); color:var(--phos-bright);
  font-family:var(--font-body); font-size:13px; padding:6px 8px; border-radius:5px; width:100%;
}
textarea:focus, input:focus, select:focus{outline:none; border-color:var(--phos);}
input[type=checkbox]{accent-color:var(--phos); width:16px; height:16px; cursor:pointer;}
label.field{display:block; margin-bottom:10px;}
label.field .flbl{display:block; font-size:10px; letter-spacing:1px; text-transform:uppercase; color:var(--phos-dim); margin-bottom:4px;}
.field-row{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.checkline{display:flex; align-items:center; gap:8px; font-size:13px; margin:6px 0;}

/* ============================================================
   INVENTORY
   ============================================================ */
.inv-summary{display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; flex-wrap:wrap; gap:8px;}
.encumbrance{font-family:var(--font-display); font-size:16px; padding:4px 10px; border-radius:5px; border:1px solid var(--phos-dim);}
.encumbrance.warn{color:var(--amber); border-color:var(--amber);}
.encumbrance.crit{color:var(--red); border-color:var(--red);}

.subtab-nav{display:flex; gap:4px; margin-bottom:12px; flex-wrap:wrap;}
.subtabbtn{background:transparent; border:1px solid var(--phos-dimmer); color:var(--phos-dim);
  font-family:var(--font-body); font-size:11px; letter-spacing:1.5px; padding:6px 12px; border-radius:5px; cursor:pointer;}
.subtabbtn:hover{background:rgba(var(--theme-glow-rgb),0.06);}
.subtabbtn.active{color:var(--phos-bright); border-color:var(--phos); background:rgba(var(--theme-glow-rgb),0.1);}

.loc-row{display:grid; grid-template-columns:100px 1fr 110px; gap:8px; align-items:center;
  padding:6px 2px; border-bottom:1px solid rgba(60,138,68,0.25);}
.loc-row:last-of-type{border-bottom:none;}
.loc-name{font-size:12px; text-transform:uppercase; letter-spacing:1px; color:var(--phos-dim);}
.loc-dr{font-size:11px; text-align:right; white-space:nowrap;}
.loc-dr span{margin-left:6px;}

table.itemtable{width:100%; border-collapse:collapse; font-size:12px;}
table.itemtable th{text-align:left; font-size:10px; text-transform:uppercase; letter-spacing:1px; color:var(--phos-dim); padding:4px; border-bottom:1px solid var(--phos-dimmer);}
table.itemtable td{padding:5px 4px; border-bottom:1px solid rgba(60,138,68,0.25); vertical-align:middle;}
table.itemtable input[type=text],table.itemtable input[type=number]{padding:3px 5px; font-size:12px;}
.catpill{font-size:9px; border:1px solid var(--phos-dim); border-radius:3px; padding:1px 5px; text-transform:uppercase;}
.iconbtn.xsmall{padding:3px 7px; font-size:10px;}
.currency-row{display:flex; gap:10px; align-items:flex-start; margin-top:8px; flex-wrap:wrap;}
.currency-chip{border:1px solid var(--phos-dimmer); border-radius:6px; padding:8px 10px; display:flex; flex-direction:column; gap:6px; align-items:flex-start;}
.currency-input{width:90px; background:rgba(0,0,0,0.3); border:1px solid var(--phos-dim); color:var(--phos-bright); font-family:var(--font-display); font-size:20px; padding:2px 6px; border-radius:4px;}
.currency-chip .stepper{flex-wrap:wrap; row-gap:4px;}
.currency-chip .stepper button{width:auto; padding:0 6px; font-size:11px;}

/* ============================================================
   PERKS
   ============================================================ */
.perk-card{border:1px solid var(--phos-dimmer); border-radius:6px; padding:8px 10px; margin-bottom:8px;}
.perk-card .phead{display:flex; justify-content:space-between; align-items:baseline; gap:8px;}
.perk-card .pname{font-family:var(--font-display); font-size:19px; color:var(--phos-bright);}
.perk-card .preq{font-size:10px; color:var(--phos-dim);}
.perk-card .peffect{font-size:12.5px; margin-top:4px; line-height:1.4;}
.perk-card .prank{font-size:10px; color:var(--amber);}
.perk-list-item{border:1px solid var(--phos-dimmer); border-radius:6px; padding:8px 10px; margin-bottom:6px; cursor:pointer;}
.perk-list-item:hover{background:rgba(var(--theme-glow-rgb),0.06);}
.perk-list-item.unmet{opacity:0.45;}
.perk-list-item .phead{display:flex; justify-content:space-between; font-family:var(--font-display); font-size:18px;}

/* ============================================================
   REPUTATION
   ============================================================ */
.rep-track{display:flex; gap:3px; margin:8px 0;}
.rep-seg{flex:1; height:20px; border:1px solid var(--phos-dimmer); cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:9px;}
.rep-seg.on{background:var(--phos-dim);}
.rep-seg.active{background:var(--phos); box-shadow:0 0 8px var(--phos-glow);}
.rep-desc{font-size:12px; color:var(--phos-dim); line-height:1.4; border-left:2px solid var(--phos-dimmer); padding-left:8px;}

/* ============================================================
   FLOATING ROLL BUTTON
   ============================================================ */
#rollFab{
  position:absolute; right:18px; bottom:18px; z-index:5;
  width:64px; height:64px; border-radius:50%;
  background:radial-gradient(circle at 35% 30%, rgba(var(--theme-glow-rgb),0.22), #05170a);
  border:2px solid var(--phos);
  color:var(--phos-bright); font-family:var(--font-display); font-size:13px; letter-spacing:1px;
  box-shadow:0 0 16px rgba(var(--theme-glow-rgb),0.35), inset 0 0 10px rgba(0,0,0,0.6);
  cursor:pointer;
}
#rollFab:hover{background:radial-gradient(circle at 35% 30%, rgba(var(--theme-glow-rgb),0.38), #05170a);}
#rollFab small{display:block; font-size:9px; color:var(--phos-dim);}

/* ============================================================
   MODALS
   ============================================================ */
.modal-overlay{
  position:fixed; inset:0; background:rgba(0,0,0,0.72); z-index:50;
  display:flex; align-items:center; justify-content:center; padding:16px;
}
.modal-overlay.hidden{display:none;}
.modal{
  background:linear-gradient(160deg, #0c1e11, #06110a);
  border:1px solid var(--phos);
  box-shadow:0 0 40px rgba(var(--theme-glow-rgb),0.15), 0 20px 60px rgba(0,0,0,0.6);
  border-radius:10px;
  width:100%; max-width:560px;
  max-height:88vh;
  display:flex; flex-direction:column;
  color:var(--phos);
  text-shadow:0 0 5px var(--phos-glow);
}
.modal-head{display:flex; justify-content:space-between; align-items:center; padding:12px 16px; border-bottom:1px solid var(--phos-dimmer);}
.modal-head h2{font-size:24px;}
.modal-body{padding:14px 16px; overflow-y:auto;}
.modal-foot{padding:12px 16px; border-top:1px solid var(--phos-dimmer); display:flex; justify-content:flex-end; gap:8px; flex-wrap:wrap;}
.closex{background:transparent; border:none; color:var(--phos); font-size:22px; cursor:pointer; line-height:1;}

/* dice roller specifics */
.diebox{display:flex; gap:6px; flex-wrap:wrap; margin:10px 0;}
.die{
  width:46px; height:46px; border-radius:6px; border:2px solid var(--phos-dim);
  display:flex; align-items:center; justify-content:center; font-family:var(--font-display); font-size:22px;
  background:rgba(0,0,0,0.35); position:relative;
}
.die.success{border-color:var(--phos); background:rgba(var(--theme-glow-rgb),0.18); color:var(--phos-bright);}
.die.crit{border-color:var(--phos-bright); background:rgba(var(--theme-glow-rgb),0.35); box-shadow:0 0 10px var(--phos-glow);}
.die.fail{opacity:0.55;}
.die.complication{border-color:var(--red); box-shadow:0 0 10px rgba(255,92,77,0.5);}
.die .tag{position:absolute; bottom:-8px; font-size:8px; letter-spacing:0.5px;}
.roll-summary{font-family:var(--font-display); font-size:20px; margin:10px 0; padding:8px; border:1px solid var(--phos-dimmer); border-radius:6px;}
.roll-summary.pass{color:var(--phos-bright); border-color:var(--phos);}
.roll-summary.fail{color:var(--red); border-color:var(--red);}
.dice-buy-row{display:flex; gap:6px; align-items:center; flex-wrap:wrap; margin:8px 0;}
.dice-buy-btn{border:1px solid var(--phos-dim); background:transparent; color:var(--phos); padding:6px 10px; border-radius:5px; cursor:pointer; font-family:var(--font-body); font-size:12px;}
.dice-buy-btn.selected{background:var(--phos-dim); color:#04170a;}
.dice-buy-btn:disabled{opacity:0.3; cursor:not-allowed;}

/* roster */
.roster-item{display:flex; justify-content:space-between; align-items:center; border:1px solid var(--phos-dimmer); border-radius:6px; padding:8px 10px; margin-bottom:6px;}
.roster-item.active{border-color:var(--phos); background:rgba(var(--theme-glow-rgb),0.08);}
.roster-item .rname{font-family:var(--font-display); font-size:19px;}
.roster-actions{display:flex; gap:6px;}

/* wizard */
.wizard-steps{display:flex; gap:4px; margin-bottom:12px;}
.wizard-step-dot{flex:1; height:4px; background:var(--phos-dimmer); border-radius:2px;}
.wizard-step-dot.done{background:var(--phos);}
.origin-card, .trait-card, .array-card{border:1px solid var(--phos-dimmer); border-radius:6px; padding:10px; margin-bottom:8px; cursor:pointer;}
.origin-card:hover, .trait-card:hover, .array-card:hover{background:rgba(var(--theme-glow-rgb),0.06);}
.origin-card.selected, .trait-card.selected, .array-card.selected{border-color:var(--phos); background:rgba(var(--theme-glow-rgb),0.1);}
.origin-card .oname{font-family:var(--font-display); font-size:20px; color:var(--phos-bright);}
.origin-card .odesc{font-size:12px; margin:4px 0;}
.origin-card .otrait{font-size:11.5px; color:var(--phos-dim); border-left:2px solid var(--phos-dimmer); padding-left:6px; margin-top:4px;}
.pointbank{font-family:var(--font-display); font-size:22px; text-align:center; padding:6px; border:1px solid var(--phos); border-radius:6px; margin-bottom:10px;}
.pointbank.zero{color:var(--phos-dim); border-color:var(--phos-dimmer);}

.empty-note{font-size:12px; color:var(--phos-dim); font-style:italic; padding:8px 0;}
.toast{
  position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
  background:#0c1e11; border:1px solid var(--phos); color:var(--phos-bright);
  padding:8px 16px; border-radius:6px; font-size:12px; z-index:99; box-shadow:0 4px 20px rgba(0,0,0,0.5);
}

@media (max-width:480px){
  #vitals{grid-template-columns:1fr 1fr;}
  .skill-row{grid-template-columns:1fr auto auto; row-gap:4px;}
  .skill-tn{display:none;}
  .tabbtn{font-size:16px;}
  #charName{font-size:24px;}
}

  <div class="case-label">
    <div class="case-label-row"><span class="rivet"></span> R.N.C. INDUSTRIES</div>

    <div class="case-label-row">NCR-ISSUE <span class="rivet"></span></div>
  </div>
  <div id="screen">

      <div id="topbar">
        <div id="charIdentity" onclick="openRoster()" title="Switch or manage characters">
          <span id="charName">—</span>
          <span id="charMeta">—</span>
        </div>
        <div id="topbarActions">

            <option value="green">Green</option>

            <option value="white">White</option>
            <option value="blue">Blue</option>
            <option value="red">Red</option>

          <button class="iconbtn" id="importBtn">Import</button>

        </div>
      </div>

      <div id="vitals"></div>

</div>

/* ==========================================================================
   STATE / STORAGE / CHARACTER MODEL
   ========================================================================== */

const STORAGE_KEY = 'pipboy.ncr.characters.v1';
const ACTIVE_KEY  = 'pipboy.ncr.activeId.v1';

let DB = { characters:{}, order:[] };
let activeId = null;
let activeTab = 'stat';

function uid(){ return 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

function newSkillMap(){
  const m = {};
  SKILLS.forEach(s => m[s.key] = {rank:0, tag:false});
  return m;
}

function newSpecialMap(){
  const m = {};
  SPECIAL_ATTRS.forEach(a => m[a.key] = 5);
  return m;
}

function newCharacter(name){
  return {
    id: uid(),
    name: name || 'New Wanderer',
    originId: null,
    traits: [],           // array of {pool, name}
    extraTagChoice: null, // for Brotherhood etc.
    level: 1,
    xp: 0,
    special: newSpecialMap(),
    skills: newSkillMap(),
    perks: [],             // array of {name, rank}
    hpCurrent: null,       // null = sync to max until first manual edit
    hpDamage: 0,
    injuries: 0,
    apPool: 0,
    luckSpent: 0,
    caps: 0,
    ncrDollars: 0,
    ncrReputation: null,   // null = use origin-based default (see ncrReputationValue)
    bosReputation: null,   // null = use origin-based default (see bosReputationValue)
    misc: { hp:0, defense:0, initiative:0, carry:0, meleeDamage:0, physDR:0, energyDR:0, radDR:0, poisonDR:0 },
    inventory: [],         // {id,name,cat,weight,qty,equipped,notes,weaponData,apparelData,aidData}
    apparel: { outfit:null, head:null, torso:null, armL:null, armR:null, legL:null, legR:null }, // slot -> inventory item id
    activeChems: [],       // [{name}] — chems currently in effect (Brief/Lasting)
    bio: '', notes: '',
    createdAt: Date.now()
  };
}

/* Body locations for the armor/DR grid. */
const BODY_LOCATIONS = [
  {key:'head',  name:'Head',       generic:'head'},
  {key:'torso', name:'Torso',      generic:'torso'},
  {key:'armL',  name:'Left Arm',   generic:'arm'},
  {key:'armR',  name:'Right Arm',  generic:'arm'},
  {key:'legL',  name:'Left Leg',   generic:'leg'},
  {key:'legR',  name:'Right Leg',  generic:'leg'}
];
function genericLocation(locKey){
  const l = BODY_LOCATIONS.find(x => x.key === locKey);
  return l ? l.generic : locKey;
}

function loadDB(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){ DB = JSON.parse(raw); }
  }catch(e){ console.warn('pipboy: could not read storage', e); }
  if(!DB.characters) DB.characters = {};
  if(!DB.order) DB.order = Object.keys(DB.characters);
  activeId = localStorage.getItem(ACTIVE_KEY);
  if(!activeId || !DB.characters[activeId]){
    activeId = DB.order[0] || null;
  }
  if(!activeId){
    const c = newCharacter('New Wanderer');
    DB.characters[c.id] = c;
    DB.order.push(c.id);
    activeId = c.id;
    persist();
  }
}

function persist(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(DB));
    if(activeId) localStorage.setItem(ACTIVE_KEY, activeId);
  }catch(e){ console.warn('pipboy: could not save storage', e); }
}

function ensureCharacterShape(c){
  if(!c) return c;
  if(c.ncrReputation === undefined) c.ncrReputation = null;
  if(c.bosReputation === undefined) c.bosReputation = null;
  if(!c.apparel) c.apparel = { outfit:null, head:null, torso:null, armL:null, armR:null, legL:null, legR:null };
  if(!c.activeChems) c.activeChems = [];
  if(!c.inventory) c.inventory = [];
  c.inventory.forEach(it => { if(it.cat === undefined) it.cat = 'Misc'; });
  return c;
}
function current(){ return ensureCharacterShape(DB.characters[activeId]); }

function getOrigin(c){ return ORIGINS.find(o => o.id === c.originId) || null; }

/* ---- SPECIAL bounds & totals -------------------------------------------- */
function specialBounds(c, key){
  const o = getOrigin(c);
  let max = 10;
  if(o && o.attrMax && o.attrMax[key] !== undefined){
    max = o.attrMax[key] - ((o.attrStartBonus && o.attrStartBonus[key]) || 0);
  }
  return {min:4, max: Math.max(4,max)};
}
function specialPoolValue(c, key){ return c.special[key]; }
function specialFinalValue(c, key){
  const o = getOrigin(c);
  const bonus = (o && o.attrStartBonus && o.attrStartBonus[key]) || 0;
  return c.special[key] + bonus;
}
function specialPoolTotal(c){
  return SPECIAL_ATTRS.reduce((sum,a) => sum + c.special[a.key], 0);
}
const SPECIAL_POOL_TARGET = 40;

/* ---- Skills --------------------------------------------------------------*/
function skillCap(c){
  const o = getOrigin(c);
  return (o && o.skillCapOverride) || 6;
}
function tagSkillCount(c){
  return Object.values(c.skills).filter(s => s.tag).length;
}
function baseTagAllowance(c){
  const o = getOrigin(c);
  let n = 3;
  if(o && o.bonusTagSlots) n += o.bonusTagSlots;
  if(o && o.extraTagChoice) n += 1;
  if(o && o.autoTagSkills) n += o.autoTagSkills.length;
  return n;
}
function skillPointPool(c){
  return 9 + specialFinalValue(c,'int');
}
function skillPointsSpent(c){
  let spent = 0;
  SKILLS.forEach(s => {
    const rec = c.skills[s.key];
    const baseline = rec.tag ? 2 : 0;
    spent += Math.max(0, rec.rank - baseline);
  });
  return spent;
}
function targetNumber(c, skillKey, attrKeyOverride){
  const s = SKILLS.find(x => x.key === skillKey);
  const attrKey = attrKeyOverride || s.attr;
  return specialFinalValue(c, attrKey) + c.skills[skillKey].rank;
}

/* ---- Derived stats ---------------------------------------------------- */
function xpForLevel(level){
  const table = {1:0,2:100,3:300,4:600,5:1000,6:1500,7:2100,8:2800,9:3600,10:4500,
    11:5500,12:6600,13:7800,14:9100,15:10500,16:12000,17:13600,18:15300,19:17100,20:19000,21:21000};
  if(table[level] !== undefined) return table[level];
  return Math.round((level*(level-1)/2)*100);
}
function levelFromXP(xp){
  let lvl = 1;
  for(let l=2; l<=200; l++){
    if(xp >= xpForLevel(l)) lvl = l; else break;
  }
  return lvl;
}

function carryWeightMax(c){
  const o = getOrigin(c);
  const base = (o && o.carryWeightFixed) ? o.carryWeightFixed : 150 + specialFinalValue(c,'str')*10;
  return base + (c.misc.carry||0);
}
function inventoryWeight(c){
  return c.inventory.reduce((sum,i) => sum + (Number(i.weight)||0) * (Number(i.qty)||0), 0);
}
function encumbranceState(c){
  const w = inventoryWeight(c), max = carryWeightMax(c);
  if(max <= 0) return {level:0,label:'Normal', diffPenalty:0, initPenalty:0};
  const over = w - max;
  if(over >= max) return {level:3, label:'Immobile', diffPenalty:99, initPenalty:99};
  if(over >= 50) return {level:2, label:'Over-Encumbered', diffPenalty:2, initPenalty:2};
  if(over > 0)   return {level:1, label:'Encumbered', diffPenalty:1, initPenalty:1};
  return {level:0, label:'Normal', diffPenalty:0, initPenalty:0};
}
function initiativeValue(c){
  const enc = encumbranceState(c);
  if(enc.level >= 3) return 0; /* immobile: carrying 2x capacity */
  return Math.max(0, specialFinalValue(c,'per') + specialFinalValue(c,'agi') - enc.initPenalty + (c.misc.initiative||0));
}
function defenseValue(c){
  const base = specialFinalValue(c,'agi') <= 8 ? 1 : 2;
  return base + (c.misc.defense||0);
}
function hpMax(c){
  return specialFinalValue(c,'end') + specialFinalValue(c,'lck') + Math.max(0,c.level-1) + (c.misc.hp||0) + activeChemBonus(c,'maxHp');
}
function hpCurrentValue(c){
  return Math.max(0, hpMax(c) - (c.hpDamage||0));
}
function meleeDamageBonus(c){
  const str = specialFinalValue(c,'str');
  let cd = 0;
  if(str >= 11) cd = 3; else if(str >= 9) cd = 2; else if(str >= 7) cd = 1;
  return cd + (c.misc.meleeDamage||0) + activeChemBonus(c,'meleeDamage');
}
function luckMax(c){ return specialFinalValue(c,'lck'); }
function luckCurrent(c){ return Math.max(0, luckMax(c) - (c.luckSpent||0)); }

function drValue(c, type){ return c.misc[type+'DR'] || 0; } /* poison DR is body-wide, not per location */

/* ---- Ammo -----------------------------------------------------------------
   Ammo is stored as Misc inventory items with isAmmo:true and an ammoType
   field (e.g. '10mm', '.45', 'Fusion Cells'). This keeps the count as a real
   editable number, independent of the item's display name. */
function ammoCount(c, ammoType){
  return c.inventory.filter(it => it.isAmmo && it.ammoType === ammoType).reduce((s,it) => s + (Number(it.qty)||0), 0);
}

/* ---- Reputation --------------------------------------------------------- */
/* NCR default standing by origin: NCR citizens/troopers start Trusting (4);
   Three Families, Ghouls, Super Mutants, and Survivors (Wastelanders) start
   Friendly (3); everyone else starts at the baseline Neutral (2). */
const NCR_REP_DEFAULT_BY_ORIGIN = {
  ncr:4,
  threefamilies:3, ghoul:3, supermutant:3, survivor:3
};
function ncrReputationValue(c){
  if(c.ncrReputation !== null && c.ncrReputation !== undefined) return c.ncrReputation;
  const o = getOrigin(c);
  return (o && NCR_REP_DEFAULT_BY_ORIGIN[o.id] !== undefined) ? NCR_REP_DEFAULT_BY_ORIGIN[o.id] : 2;
}
function bosReputationValue(c){
  if(c.bosReputation !== null && c.bosReputation !== undefined) return c.bosReputation;
  const o = getOrigin(c);
  return (o && o.brotherhoodAffiliated) ? 3 : 1;
}

/* ---- Inventory / equipment lookups -------------------------------------- */
function findItem(c, id){ return c.inventory.find(i => i.id === id) || null; }

/* ---- Chems --------------------------------------------------------------- */
function chemDef(name){ return CHEMS.find(x => x.name === name) || null; }
function activeChemBonus(c, field){
  return (c.activeChems||[]).reduce((sum, ac) => {
    const def = chemDef(ac.name);
    if(!def || !def.mech) return sum;
    return sum + (def.mech[field] || 0);
  }, 0);
}
function chemAttackDamageBonus(c){ return activeChemBonus(c, 'atkDamage'); }

/* ---- Body armor / location DR ------------------------------------------- */
function locationDR(c, locKey, dmgType){
  /* dmgType: 'phys' | 'energy' | 'rad' */
  let val = 0;
  const generic = genericLocation(locKey);
  const outfitId = c.apparel.outfit;
  if(outfitId){
    const it = findItem(c, outfitId);
    if(it && it.apparelData && it.apparelData.locations.includes(generic)){
      val = Math.max(val, it.apparelData[dmgType] || 0);
    }
  }
  const slotId = c.apparel[locKey];
  if(slotId){
    const it = findItem(c, slotId);
    if(it && it.apparelData) val = Math.max(val, it.apparelData[dmgType] || 0);
  }
  val += (c.misc[dmgType+'DR'] || 0);
  val += activeChemBonus(c, dmgType+'DR');
  return val;
}
function locationRadImmune(c, locKey){
  const generic = genericLocation(locKey);
  const outfitId = c.apparel.outfit;
  if(outfitId){
    const it = findItem(c, outfitId);
    if(it && it.apparelData && it.apparelData.radImmune && it.apparelData.locations.includes(generic)) return true;
  }
  const slotId = c.apparel[locKey];
  if(slotId){
    const it = findItem(c, slotId);
    if(it && it.apparelData && it.apparelData.radImmune) return true;
  }
  return false;
}
/* Apparel items in inventory that could be equipped into a given slot.
   locKey is one of 'outfit' or a BODY_LOCATIONS key (head/torso/armL/armR/legL/legR). */
function apparelOptionsForSlot(c, locKey){
  const wantSlot = (locKey === 'outfit') ? 'outfit' : genericLocation(locKey);
  return c.inventory.filter(it => it.cat === 'Apparel' && it.apparelData && it.apparelData.slot === wantSlot);
}
/* ==========================================================================
   RENDERING
   ========================================================================== */

function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
}

function renderAll(){
  const c = current();
  if(!c) return;
  renderHeader(c);
  renderVitals(c);
  renderStatTab(c);
  renderInvTab(c);
  renderDataTab(c);
  persist();
}

function renderHeader(c){
  const o = getOrigin(c);
  document.getElementById('charName').textContent = c.name || 'UNNAMED';
  const lvl = `LV ${c.level}`;
  const originName = o ? o.name.toUpperCase() : 'NO ORIGIN SET';
  document.getElementById('charMeta').textContent = `${lvl} • ${originName}`;
}

function renderVitals(c){
  const hpMaxV = hpMax(c), hpCurV = hpCurrentValue(c);
  const hpPct = hpMaxV>0 ? Math.max(0,Math.min(100, (hpCurV/hpMaxV)*100)) : 0;
  const hpClass = hpPct <= 25 ? 'crit' : (hpPct <= 50 ? 'warn' : '');
  const lMax = luckMax(c), lCur = luckCurrent(c);
  let luckPips = '';
  for(let i=1;i<=Math.max(lMax,0);i++){
    luckPips += `<div class="pip ${i<=lCur?'filled':''}" onclick="setLuckFilled(${i})" title="Luck point"></div>`;
  }
  const apMax = 6;
  let apPips = '';
  for(let i=1;i<=apMax;i++){
    apPips += `<div class="pip ${i<=c.apPool?'filled':''}" onclick="setAPPool(${i})" title="Action Point"></div>`;
  }
  document.getElementById('vitals').innerHTML = `
    <div class="vital-box">
      <div class="vital-label"><span>HP</span><span>${hpCurV} / ${hpMaxV}</span></div>
      <div class="bar-track"><div class="bar-fill ${hpClass}" style="width:${hpPct}%"></div></div>
      <div class="stepper" style="margin-top:6px; flex-wrap:wrap; gap:4px;">
        <button onclick="adjustHP(-5)" title="Take 5 damage">-5</button>
        <button onclick="adjustHP(-1)" title="Take 1 damage">-1</button>
        <button onclick="adjustHP(1)" title="Heal 1">+1</button>
        <button onclick="adjustHP(5)" title="Heal 5">+5</button>
        <span class="small-caps" style="margin-left:auto;">INJ</span>
        <button onclick="adjustInjuries(-1)">−</button>
        <span class="num-display" style="font-size:16px;">${c.injuries||0}</span>
        <button onclick="adjustInjuries(1)">+</button>
      </div>
    </div>
    <div class="vital-box">
      <div class="vital-label"><span>Party AP</span><span>${c.apPool}/6</span></div>
      <div class="pip-row">${apPips}</div>
    </div>
    <div class="vital-box">
      <div class="vital-label"><span>Luck</span><span>${lCur}/${lMax}</span></div>
      <div class="pip-row">${luckPips}</div>
    </div>
  `;
}

function switchTab(tab){
  activeTab = tab;
  document.querySelectorAll('.tabbtn').forEach(b => b.classList.toggle('active', b.dataset.tab===tab));
  document.querySelectorAll('.tabpanel').forEach(p => p.classList.toggle('active', p.id==='tab-'+tab));
}

    const bonus = (o && o.attrStartBonus && o.attrStartBonus[a.key]) || 0;
    const finalV = specialFinalValue(c,a.key);
    return `<div class="special-card" title="${esc(a.blurb)}">
      <div class="abbr">${a.abbr}</div>
      <div class="val">${finalV}${bonus?`<span style="font-size:12px;color:var(--amber);">+${bonus}</span>`:''}</div>
      <div class="name">${a.name}</div>

        <button onclick="adjustSpecial('${a.key}',1)">+</button>
      </div>
    </div>`;
  }).join('');

  const skillsHtml = SKILLS.map(s => {
    const rec = c.skills[s.key];
    const tn = targetNumber(c, s.key);
    return `<div class="skill-row">
      <div class="skill-name">
        <input type="checkbox" ${rec.tag?'checked':''} onchange="toggleTag('${s.key}')" title="Tag skill">
        ${esc(s.name)} ${rec.tag?'<span class="tag-badge">TAG</span>':''}
      </div>
      <div class="skill-attr">${s.attr.toUpperCase()}</div>
      <div class="stepper">
        <button onclick="adjustSkill('${s.key}',-1)">−</button>
        <span class="skill-rank-val">${rec.rank}</span>
        <button onclick="adjustSkill('${s.key}',1)">+</button>
      </div>
      <div class="skill-tn">TN ${tn}</div>
      <button class="rollbtn" onclick="openRoller('${s.key}')">ROLL</button>
    </div>`;
  }).join('');

  const enc = encumbranceState(c);
  const chemAtk = chemAttackDamageBonus(c);
  const derivedHtml = `
    <div class="derived-grid">
      <div class="derived-box"><div class="lbl">Defense</div><div class="val">${defenseValue(c)}</div></div>
      <div class="derived-box"><div class="lbl">Initiative</div><div class="val">${initiativeValue(c)}</div></div>
      <div class="derived-box"><div class="lbl">Carry Wt.</div><div class="val">${inventoryWeight(c).toFixed(1)}/${carryWeightMax(c)}</div><div class="sub">${enc.label}</div></div>
      <div class="derived-box"><div class="lbl">Melee Dmg.</div><div class="val">+${meleeDamageBonus(c)} CD</div><div class="sub">Combat Dice</div></div>
      <div class="derived-box"><div class="lbl">Poison DR</div>
        <div class="stepper"><button onclick="adjustMisc('poisonDR',-1)">−</button><span class="val" style="font-size:20px;">${drValue(c,'poison')}</span><button onclick="adjustMisc('poisonDR',1)">+</button></div></div>
      ${chemAtk ? `<div class="derived-box"><div class="lbl">Chem Atk. Dmg.</div><div class="val">+${chemAtk} CD</div><div class="sub">from active chems</div></div>` : ''}
    </div>
    <div class="hint" style="margin-top:8px;">Physical / Energy / Radiation DR are tracked per body location — see INV → Apparel.</div>
    <details style="margin-top:10px;">
      <summary class="small-caps" style="cursor:pointer;">Misc. modifiers (from perks/gear not tracked above)</summary>
      <div class="field-row" style="margin-top:8px;">
        ${['hp','defense','initiative','carry','meleeDamage'].map(k => `
          <label class="field"><span class="flbl">${k}</span>
            <div class="stepper"><button onclick="adjustMisc('${k}',-1)">−</button><span>${c.misc[k]||0}</span><button onclick="adjustMisc('${k}',1)">+</button></div>
          </label>`).join('')}
      </div>
    </details>
  `;

  const levelXpNext = xpForLevel(c.level+1);
  const originBlock = o ? `
    <div class="small-caps">Origin</div>
    <div style="font-family:var(--font-display); font-size:22px; color:var(--phos-bright);">${esc(o.name)}</div>
    <div style="font-size:12px; margin:4px 0 8px;">${esc(o.blurb)}</div>
    <div class="small-caps">Trait — ${esc(o.traitName)}</div>
    <div style="font-size:12px;">${esc(o.traitEffect)}</div>
    ${badgesForOrigin(o)}
  ` : `<div class="empty-note">No origin set. Use "New" to run character creation, or set an origin in the wizard any time.</div>`;

  el.innerHTML = `
    <div class="panel">
      <div class="panel-title">ORIGIN &amp; LEVEL <span class="hint">Lv ${c.level} • ${c.xp} XP (next ${levelXpNext})</span></div>

        </label>
      </div>
    </div>

    <div class="panel">
      <div class="panel-title">S.P.E.C.I.A.L. <span class="hint">${poolLeft>=0?`${poolLeft} pt(s) left`:`${-poolLeft} pt(s) over!`} of ${SPECIAL_POOL_TARGET}</span></div>
      <div class="grid-special">${specialHtml}</div>
      <div class="dice-buy-row" style="margin-top:10px;">

        <button class="dice-buy-btn" onclick="applyArray('focused')">Focused 8/7/6/6/5/4/4</button>
        <button class="dice-buy-btn" onclick="applyArray('specialized')">Specialized 9/8/5/5/5/4/4</button>

    <div class="panel">
      <div class="panel-title">SKILLS <span class="hint">${tagSkillCount(c)}/${baseTagAllowance(c)} tagged • ${skillPointsSpent(c)}/${skillPointPool(c)} pts spent • cap ${skillCap(c)}</span></div>
      ${skillsHtml}
    </div>

    <div class="panel">
      <div class="panel-title">DERIVED STATISTICS</div>
      ${derivedHtml}
    </div>

    <div class="panel">
      <div class="panel-title">PERKS <span class="hint"><button class="iconbtn xsmall" onclick="openPerkBrowser()">+ Add Perk</button></span></div>
      ${renderOwnedPerks(c)}
    </div>
  `;
}

function badgesForOrigin(o){
  const badges = [];
  if(o.isRobot) badges.push('ROBOT');
  if(o.immuneRadiation) badges.push('RAD IMMUNE');
  if(o.immunePoison) badges.push('POISON IMMUNE');
  if(o.noChemsFoodRest) badges.push('NO CHEMS/FOOD/REST');
  if(o.carryWeightFixed) badges.push(`FIXED CARRY ${o.carryWeightFixed} LBS`);
  if(o.brotherhoodAffiliated) badges.push('BROTHERHOOD AFFILIATED');
  if(!badges.length) return '';
  return `<div style="margin-top:6px; display:flex; gap:6px; flex-wrap:wrap;">${badges.map(b=>`<span class="tag-badge" style="border-color:var(--phos-dim); color:var(--phos-dim);">${b}</span>`).join('')}</div>`;
}

function renderOwnedPerks(c){
  if(!c.perks.length) return '<div class="empty-note">No perks yet. Every level grants one — add it here for quick reference.</div>';
  return c.perks.map((p,idx) => {
    const def = PERKS.find(x => x.name === p.name);
    return `<div class="perk-card">
      <div class="phead">
        <span class="pname">${esc(p.name)}</span>
        <button class="iconbtn xsmall danger" onclick="removePerk(${idx})">Remove</button>
      </div>
      ${def && def.ranks>1 ? `<div class="prank">Rank ${p.rank} / ${def.ranks} &nbsp; <button class="iconbtn xsmall" onclick="adjustPerkRank(${idx},1)">+ rank</button> <button class="iconbtn xsmall" onclick="adjustPerkRank(${idx},-1)">− rank</button></div>` : ''}
      <div class="peffect">${esc((def&&def.effect)||'')}</div>
    </div>`;
  }).join('');
}

const RANGE_NAMES = {C:'Close', M:'Medium', L:'Long'};

  const rows = items.map(({it,idx}) => {
    const wd = it.weaponData;
    const skillDef = wd ? SKILLS.find(s => s.key === wd.skill) : null;
    const hasAmmo = wd && wd.ammo && wd.ammo !== '-';
    const ammoHtml = hasAmmo ? `<div class="stepper" style="margin-top:4px;" title="${esc(wd.ammo)} in inventory">

        <button onclick="adjustAmmo('${esc(wd.ammo)}',1)">+</button>
      </div>` : '';
    return `<tr>
      <td>${wd ?
        `<b>${esc(it.name)}</b><div class="hint">${skillDef?esc(skillDef.name):''}</div>${ammoHtml}` :
        `<input type="text" value="${esc(it.name)}" oninput="updateItem(${idx},'name',this.value)" placeholder="Weapon name">`}</td>

    return `<div class="loc-row">

const ARRAYS = {balanced:[6,6,6,6,6,5,5], focused:[8,7,6,6,5,4,4], specialized:[9,8,5,5,5,4,4]};

function clamp(min,max,v){ return Math.max(min, Math.min(max, v)); }

function toast(msg){
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2600);
}

/* ---- UI theme ------------------------------------------------------------- */
const THEME_KEY = 'pipboy.theme.v1';
function setTheme(theme){
  if(!VALID_THEMES.includes(theme)) theme = 'green';
  document.body.dataset.theme = theme;
  try{ localStorage.setItem(THEME_KEY, theme); }catch(e){}
  const sel = document.getElementById('themeSelect');
  if(sel && sel.value !== theme) sel.value = theme;
}
function loadTheme(){
  let theme = 'green';
  try{ theme = localStorage.getItem(THEME_KEY) || 'green'; }catch(e){}
  setTheme(theme);
}

/* ---- generic modal shell ------------------------------------------------ */
function showModal(innerHtml){
  const root = document.getElementById('modalRoot');
  root.innerHTML = `<div class="modal-overlay" id="modalOverlay"><div class="modal">${innerHtml}</div></div>`;
  document.getElementById('modalOverlay').addEventListener('click', (e) => {
    if(e.target.id === 'modalOverlay') closeModal();
  });
}
function closeModal(){
  document.getElementById('modalRoot').innerHTML = '';
  rollState = null;
}

/* ---- SPECIAL / Skills (live sheet) -------------------------------------- */
function adjustSpecial(key, delta){
  const c = current();
  const bounds = specialBounds(c, key);
  const val = c.special[key] + delta;
  if(val < bounds.min || val > bounds.max) return;
  c.special[key] = val;
  renderAll();
}
function applyArray(name){
  const c = current();
  const arr = ARRAYS[name];
  if(!arr) return;
  SPECIAL_ATTRS.forEach((a,i) => { c.special[a.key] = arr[i]; });
  renderAll();
  toast('Array applied — fine-tune with the +/− steppers if you like.');
}
function adjustSkill(key, delta){
  const c = current();
  const rec = c.skills[key];
  const cap = skillCap(c);
  const baseline = rec.tag ? 2 : 0;
  const val = rec.rank + delta;
  if(val < baseline || val > cap) return;
  rec.rank = val;
  renderAll();
}
function toggleTag(key){
  const c = current();
  const rec = c.skills[key];
  if(!rec.tag){
    if(tagSkillCount(c) >= baseTagAllowance(c)){
      toast('All tag skill slots are in use ('+baseTagAllowance(c)+'). Untag one first.');
      return;
    }
    rec.tag = true;
    if(rec.rank < 2) rec.rank = 2;
  } else {
    rec.tag = false;
  }
  renderAll();
}

/* ---- Vitals: HP / Injuries / AP / Luck ---------------------------------- */
function adjustHP(delta){ /* positive = heal, negative = damage */
  const c = current();
  let dmg = (c.hpDamage||0) - delta;
  dmg = clamp(0, hpMax(c), dmg);
  c.hpDamage = dmg;
  renderAll();
}
function adjustInjuries(delta){
  const c = current();
  c.injuries = clamp(0, 20, (c.injuries||0) + delta);
  renderAll();
}
function setAPPool(n){
  const c = current();
  c.apPool = (c.apPool === n) ? n-1 : n;
  c.apPool = clamp(0, 6, c.apPool);
  renderAll();
}
function setLuckFilled(n){
  const c = current();
  const maxL = luckMax(c);
  const curFilled = luckCurrent(c);
  let newFilled = (curFilled === n) ? n-1 : n;
  newFilled = clamp(0, maxL, newFilled);
  c.luckSpent = maxL - newFilled;
  renderAll();
}

/* ---- Misc derived modifiers, level/XP ----------------------------------- */
function adjustMisc(key, delta){
  const c = current();
  c.misc[key] = (c.misc[key]||0) + delta;
  renderAll();
}
function adjustLevel(delta){
  const c = current();
  c.level = clamp(1, 999, c.level + delta);
  renderAll();
}
function adjustXP(delta){
  const c = current();
  c.xp = Math.max(0, (c.xp||0) + delta);
  renderAll();
}

/* ---- Inventory ------------------------------------------------------------ */
function addItem(cat){
  const c = current();
  c.inventory.push({id:uid(), name:'', cat:cat||'Misc', weight:0, qty:1, equipped:false});
  renderAll();
}
function updateItem(idx, field, value){
  const c = current();
  const it = c.inventory[idx];
  if(!it) return;
  if(field === 'weight') it.weight = parseFloat(value) || 0;
  else if(field === 'qty') it.qty = parseInt(value,10) || 0;
  else if(field === 'equipped') it.equipped = !!value;
  else it[field] = value;
  persist();
  if(field === 'weight' || field === 'qty') patchInvSummary(c);
}
function patchInvSummary(c){
  const w = inventoryWeight(c), max = carryWeightMax(c);
  const enc = encumbranceState(c);
  const wEl = document.getElementById('invWeightDisplay');
  if(wEl) wEl.textContent = `${w.toFixed(1)} / ${max} lbs`;
  const badge = document.getElementById('invEncBadge');
  if(badge){
    badge.textContent = enc.label;
    badge.className = 'encumbrance ' + (enc.level>=2?'crit':(enc.level===1?'warn':''));
  }
}
function removeItem(idx){
  const c = current();
  c.inventory.splice(idx,1);
  renderAll();
}
function adjustCurrency(field, delta){
  const c = current();
  c[field] = Math.max(0, (c[field]||0) + delta);
  renderAll();
}
function setCurrency(field, value){
  const c = current();
  const n = parseInt(value, 10);
  c[field] = isNaN(n) ? 0 : Math.max(0, n);
  persist();
}
function adjustAmmo(ammoType, delta){
  const c = current();
  let it = c.inventory.find(x => x.isAmmo && x.ammoType === ammoType);
  if(it){
    it.qty = (Number(it.qty)||0) + delta;
    if(it.qty <= 0) c.inventory.splice(c.inventory.indexOf(it), 1);
  } else if(delta > 0){
    c.inventory.push({id:uid(), name:ammoType+' Ammo', cat:'Misc', weight:0, qty:delta, equipped:false, isAmmo:true, ammoType:ammoType});
  }
  renderAll();
}

/* ---- Character identity / notes (live-patch, no full re-render) -------- */
function renameChar(value){
  const c = current();
  c.name = value;
  persist();
  document.getElementById('charName').textContent = value || 'UNNAMED';
}
function updateBio(value){ current().bio = value; persist(); }
function updateNotes(value){ current().notes = value; persist(); }

/* ---- Traits -------------------------------------------------------------- */
function openTraitPicker(pool){
  const label = {survivor:'Survivor', ncr:'New California Republic', newvegas:'New Vegas'}[pool] || pool;
  const html = `
    <div class="modal-head"><h2>${esc(label)} TRAITS</h2><button class="closex" onclick="closeModal()">✕</button></div>

  `;

}
function renderTraitPickList(pool){

  const list = TRAIT_POOLS[pool] || [];

  if(!body) return;
  body.innerHTML = list.map(t => {

function removeTrait(idx){

  renderAll();
}
function setReputation(rank){

  renderAll();
}
function setBosReputation(rank){

  c.bosReputation = rank;

}

/* ---- Perk browser ---------------------------------------------------------*/
function requirementsMet(c, req){
  if(!req) return true;
  for(const k in req){
    if(k === 'level'){ if(c.level < req.level) return false; }
    else if(specialFinalValue(c,k) < req[k]) return false;
  }
  return true;
}
function reqText(req){
  if(!req) return 'None';
  const parts = [];
  if(req.level !== undefined) parts.push('Lv '+req.level);
  SPECIAL_ATTRS.forEach(a => { if(req[a.key] !== undefined) parts.push(a.abbr+' '+req[a.key]); });
  return parts.length ? parts.join(', ') : 'None';
}
function openPerkBrowser(){
  const html = `
    <div class="modal-head"><h2>PERKS DATABASE</h2><button class="closex" onclick="closeModal()">✕</button></div>
    <div class="modal-body">
      <input type="text" placeholder="Search perks..." oninput="filterPerkList(this.value)">
      <div id="perkListContainer" style="margin-top:10px;"></div>
    </div>
    <div class="modal-foot"><button class="iconbtn" onclick="closeModal()">Close</button></div>
  `;
  showModal(html);
  filterPerkList('');
}
function filterPerkList(q){
  const c = current();
  q = (q||'').toLowerCase();
  const container = document.getElementById('perkListContainer');
  if(!container) return;
  const owned = {}; c.perks.forEach(p => owned[p.name] = p);
  const items = PERKS.filter(p => p.name.toLowerCase().includes(q));
  container.innerHTML = items.map(p => {
    const met = requirementsMet(c, p.req);
    const isOwned = owned[p.name];
    return `<div class="perk-list-item ${met?'':'unmet'}" data-perk="${esc(p.name)}">
      <div class="phead"><span>${esc(p.name)}${isOwned?` (rank ${isOwned.rank}/${p.ranks})`:''}</span><span class="preq">${esc(reqText(p.req))}</span></div>
      <div class="peffect">${esc(p.effect)}</div>
    </div>`;
  }).join('') || '<div class="empty-note">No perks match.</div>';
  container.querySelectorAll('[data-perk]').forEach(el => {
    el.addEventListener('click', () => addOrRankPerk(el.dataset.perk));
  });
}
function addOrRankPerk(name){
  const c = current();
  const def = PERKS.find(p => p.name === name);
  if(!def) return;
  const owned = c.perks.find(p => p.name === name);
  if(owned){
    if(owned.rank < def.ranks) owned.rank++;
    else { toast('Already at max rank.'); return; }
  } else {
    if(!requirementsMet(c, def.req)){
      toast('Requirements not met (' + reqText(def.req) + ') \u2014 added anyway.');
    }
    c.perks.push({name, rank:1});
  }
  renderStatTab(c);
  filterPerkList(document.querySelector('#modalRoot input')?.value || '');
  persist();
  toast((owned?'Ranked up: ':'Perk added: ') + name);
}
function adjustPerkRank(idx, delta){
  const c = current();
  const p = c.perks[idx];
  if(!p) return;
  const def = PERKS.find(x => x.name === p.name);
  const maxR = def ? def.ranks : 1;
  const val = p.rank + delta;
  if(val < 1){ removePerk(idx); return; }
  if(val > maxR) return;
  p.rank = val;
  renderAll();
}
function removePerk(idx){
  const c = current();
  c.perks.splice(idx,1);
  renderAll();
}

function equipSourceList(kind){

function openEquipBrowser(kind){

    <div class="modal-foot"><button class="iconbtn" onclick="closeModal()">Close</button></div>
  `;
  showModal(html);

function equipListItemHtml(kind, def){
  const src = def.book === 'nv' ? 'New Vegas' : 'Core';
  if(kind === 'weapon'){
    return `<div class="phead"><span>${esc(def.name)}</span><span class="preq">${src}</span></div>
      <div class="peffect">${def.dmg} CD ${esc(def.dtype)}${def.effects.length?' · '+esc(def.effects.join(', ')):''}${def.fireRate!=null?' · FR '+def.fireRate:''}${def.range?' · '+RANGE_NAMES[def.range]:''}${def.qualities.length?' · '+esc(def.qualities.join(', ')):''} · ${def.weight} lbs · ${def.cost} caps</div>`;
  }
  if(kind === 'apparel'){
    return `<div class="phead"><span>${esc(def.name)}</span><span class="preq">${src}</span></div>
      <div class="peffect">Covers ${esc(def.locations.join(', ')||'—')} · Phys ${def.phys} / Energy ${def.energy} / Rad ${def.radImmune?'Immune':def.rad}${def.special?' · '+esc(def.special):''} · ${def.weight} lbs · ${def.cost} caps</div>`;
  }
  return `<div class="phead"><span>${esc(def.name)}</span><span class="preq">${esc(def.duration)}</span></div>
    <div class="peffect">${esc(def.effect)}</div>`;
}
function filterEquipList(kind, q){
  q = (q||'').toLowerCase();
  const container = document.getElementById('equipListContainer');
  if(!container) return;
  const items = equipSourceList(kind).filter(x => x.name.toLowerCase().includes(q));
  container.innerHTML = items.map(def => `<div class="perk-list-item" data-equip="${esc(def.name)}">${equipListItemHtml(kind, def)}</div>`).join('') || '<div class="empty-note">No matches.</div>';
  container.querySelectorAll('[data-equip]').forEach(el => {
    el.addEventListener('click', () => addEquipToInventory(kind, el.dataset.equip));
  });
}
function addEquipToInventory(kind, name){
  const c = current();
  const def = equipSourceList(kind).find(x => x.name === name);
  if(!def) return;
  const clone = JSON.parse(JSON.stringify(def));
  if(kind === 'weapon'){
    c.inventory.push({id:uid(), name:clone.name, cat:'Weapon', weight:clone.weight, qty:1, equipped:false, weaponData:clone});
  } else if(kind === 'apparel'){
    c.inventory.push({id:uid(), name:clone.name, cat:'Apparel', weight:clone.weight, qty:1, equipped:false, apparelData:clone});
  } else {
    const existing = c.inventory.find(it => it.cat==='Aid' && it.aidData && it.aidData.name===clone.name);
    if(existing) existing.qty = (existing.qty||0) + 1;
    else c.inventory.push({id:uid(), name:clone.name, cat:'Aid', weight:clone.weight, qty:1, equipped:false, aidData:clone});
  }
  persist();
  renderAll();
  toast(clone.name + ' added to inventory.');
}

/* ---- Chems ------------------------------------------------------------------*/
function useAidItem(idx){
  const c = current();
  const it = c.inventory[idx];
  if(!it || !it.aidData) return;
  applyChemEffect(c, it.aidData);
  it.qty = (it.qty||1) - 1;
  if(it.qty <= 0) c.inventory.splice(idx,1);
  persist();
  renderAll();
}
function applyChemEffect(c, def){
  const mech = def.mech || {};
  const msgParts = [];
  if(mech.instantHeal){
    c.hpDamage = clamp(0, hpMax(c), (c.hpDamage||0) - mech.instantHeal);
    msgParts.push('+' + mech.instantHeal + ' HP');
  }
  if(mech.ap){
    c.apPool = clamp(0, 6, (c.apPool||0) + mech.ap);
    msgParts.push('+' + mech.ap + ' AP');
  }
  const hasOngoing = ['maxHp','physDR','energyDR','radDR','meleeDamage','atkDamage'].some(k => mech[k]);
  if(hasOngoing && (def.duration === 'Brief' || def.duration === 'Lasting')){
    c.activeChems.push({name: def.name});
    msgParts.push('effect active until ended');
  }
  toast(def.name + ' used' + (msgParts.length ? ': ' + msgParts.join(', ') : '.'));
}
function endChemEffect(i){
  const c = current();
  const removed = (c.activeChems||[]).splice(i,1)[0];
  persist();
  renderAll();
  if(removed) toast(removed.name + ' effect ended.');
}
function endAllChemEffects(){
  const c = current();
  if(!(c.activeChems||[]).length) return;
  c.activeChems = [];
  persist();
  renderAll();
  toast('All chem effects ended.');
}

}
function duplicateCharacter(id){
  const src = DB.characters[id];
  if(!src) return;
  const copy = JSON.parse(JSON.stringify(src));
  copy.id = uid();
  copy.name = src.name + ' (Copy)';
  DB.characters[copy.id] = copy;
  DB.order.push(copy.id);
  persist();
  renderRosterList();

}
function deleteCharacter(id){
  if(!confirm('Delete this character permanently?')) return;
  delete DB.characters[id];
  DB.order = DB.order.filter(x => x !== id);
  if(activeId === id){
    activeId = DB.order[0] || null;
    if(!activeId){
      const c = newCharacter('New Wanderer');
      DB.characters[c.id] = c; DB.order.push(c.id); activeId = c.id;
    }
  }
  persist();
  renderRosterList();
  renderAll();
}

/* ---- Import / Export -------------------------------------------------------*/
function exportCurrent(){
  const c = current();
  const blob = new Blob([JSON.stringify(c,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = (c.name||'character').replace(/[^a-z0-9\-_]+/gi,'_') + '.pipboy.json';
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}
function handleImportFile(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const obj = JSON.parse(reader.result);
      if(!obj || !obj.special || !obj.skills){ toast('That file doesn’t look like a character export.'); return; }
      obj.id = uid();
      ensureCharacterShape(obj);
      DB.characters[obj.id] = obj;
      DB.order.push(obj.id);
      activeId = obj.id;
      persist();
      renderAll();
      toast('Imported: ' + (obj.name || 'Unnamed'));
    }catch(err){
      toast('Could not read that file.');
    }
  };
  reader.readAsText(file);
  e.target.value = '';
}
/* ==========================================================================
   STARTING EQUIPMENT
   Packs paraphrased/tabulated from the Fallout 2d20 Core Rulebook (Chapter 3,
   "Choose Equipment", pgs. 75-80), the Settlers Supplement, the New Vegas
   Setting Guide, and the Wanderer's Guidebook. One representative pack is
   assigned per origin (the game normally offers a choice of several; where
   a component itself offers an "or" choice, the first option is used).
   Ammo/currency quantities use the game's "base + N Combat Dice" formula and
   are rolled for real using the same Combat Dice faces as weapon damage
   (1,2,0,0,1,1 on a d6). Personal trinkets and the Outcast Equipment Table
   are also rolled for real (d20) against the book's actual tables.
   Entries not tied to a concrete weapon/armor/chem in this app's database
   (robot attachments, mods, books, brahmin, loot-table rolls, etc.) are
   added as plain reference lines in Misc so nothing granted is silently lost.
   ========================================================================== */

function rollCombatDie(){
  const faces = [1,2,0,0,1,1]; /* Combat Dice Results table: 1,2,blank,blank,1+FX,1+FX */
  return faces[Math.floor(Math.random()*6)];
}
function rollCD(n){
  let total = 0;
  for(let i=0;i<(n||0);i++) total += rollCombatDie();
  return total;
}
function rollD20(){ return 1 + Math.floor(Math.random()*20); }
function roll2d20(){ return rollD20() + rollD20(); }
function roll2d20Table(table){ return table[roll2d20()-2]; } /* table indexed for sums 2-40 */

function describeStartingPack(originId){
  const pack = STARTING_PACKS[originId];
  if(!pack) return null;
  const lines = pack.items.map(it => {
    if(it.t === 'weapon' || it.t === 'armor') return it.name + (it.note ? ' ('+it.note+')' : '');
    if(it.t === 'chem') return (it.qty>1?it.qty+'x ':'') + it.name;
    if(it.t === 'randomChem') return 'Random chem/aid roll';
    if(it.t === 'food') return (it.qty>1?it.qty+'x ':'') + 'Food item (rolled)';
    if(it.t === 'beverage') return (it.qty>1?it.qty+'x ':'') + 'Beverage (rolled)';
    if(it.t === 'ammo') return it.name + ' ammunition (' + it.base + ' + ' + it.dice + 'CD)';
    if(it.t === 'caps') return 'Caps (' + it.base + (it.dice?'+'+it.dice+'CD':'') + ')';
    if(it.t === 'ncrDollars') return 'NCR Dollars (' + it.base + (it.dice?'+'+it.dice+'CD':'') + ')';
    if(it.t === 'trinket') return 'Personal trinket (rolled)';
    if(it.t === 'outcastRoll') return 'Outcast Equipment Table roll';
    return it.name;
  });
  return {name:pack.name, book:pack.book, lines};
}

/* Actually resolves the pack, rolling dice and pushing real inventory items
   onto the character. Returns an array of short strings describing what was
   granted, for a summary toast. */
function grantStartingEquipment(c){
  const pack = STARTING_PACKS[c.originId];
  if(!pack) return [];
  const granted = [];

  function addWeapon(name, note){
    const def = WEAPONS.find(w => w.name === name);
    if(!def){ granted.push(name+' (weapon not found)'); return; }
    const clone = JSON.parse(JSON.stringify(def));
    c.inventory.push({id:uid(), name:clone.name + (note?' \u2014 '+note:''), cat:'Weapon', weight:clone.weight, qty:1, equipped:false, weaponData:clone});
    granted.push(clone.name);
  }
  function addArmor(name, note){
    const def = ARMOR.find(a => a.name === name);
    if(!def){ granted.push(name+' (armor not found)'); return; }
    const clone = JSON.parse(JSON.stringify(def));
    c.inventory.push({id:uid(), name:clone.name + (note?' \u2014 '+note:''), cat:'Apparel', weight:clone.weight, qty:1, equipped:false, apparelData:clone});
    granted.push(clone.name);
  }
  function addChem(name, qty){
    const def = CHEMS.find(x => x.name === name);
    if(!def){ granted.push(name+' (chem not found)'); return; }
    const clone = JSON.parse(JSON.stringify(def));
    const existing = c.inventory.find(it => it.cat==='Aid' && it.aidData && it.aidData.name===clone.name);
    if(existing) existing.qty = (existing.qty||0) + (qty||1);
    else c.inventory.push({id:uid(), name:clone.name, cat:'Aid', weight:clone.weight, qty:qty||1, equipped:false, aidData:clone});
    granted.push((qty>1?qty+'x ':'') + clone.name);
  }
  function addMisc(name, qty){
    qty = qty || 1;
    const existing = c.inventory.find(x => x.cat==='Misc' && !x.isAmmo && x.name===name);
    if(existing) existing.qty = (existing.qty||0) + qty;
    else c.inventory.push({id:uid(), name:name, cat:'Misc', weight:0, qty:qty, equipped:false});
    granted.push((qty>1?qty+'x ':'') + name);
  }
  function addAmmoQty(ammoType, qty){
    const existing = c.inventory.find(x => x.isAmmo && x.ammoType===ammoType);
    if(existing) existing.qty = (existing.qty||0) + qty;
    else c.inventory.push({id:uid(), name:ammoType+' Ammo', cat:'Misc', weight:0, qty:qty, equipped:false, isAmmo:true, ammoType:ammoType});
    granted.push(qty + 'x ' + ammoType + ' Ammo');
  }
  function addAmmo(name, base, dice){
    addAmmoQty(name, base + rollCD(dice));
  }

  pack.items.forEach(it => {
    if(it.t === 'weapon') addWeapon(it.name, it.note);
    else if(it.t === 'armor') addArmor(it.name, it.note);
    else if(it.t === 'chem') addChem(it.name, it.qty);
    else if(it.t === 'randomChem'){
      const pool = CHEMS.filter(x => x.book === (it.book||'core'));
      const pick = pool[Math.floor(Math.random()*pool.length)];
      if(pick) addChem(pick.name, 1);
    }
    else if(it.t === 'ammo') addAmmo(it.name, it.base, it.dice);
    else if(it.t === 'food'){
      for(let i=0;i<(it.qty||1);i++) addMisc(roll2d20Table(FOOD_TABLE), 1);
    }
    else if(it.t === 'beverage'){
      for(let i=0;i<(it.qty||1);i++) addMisc(roll2d20Table(BEVERAGE_TABLE), 1);
    }
    else if(it.t === 'caps'){
      const amt = (it.base||0) + rollCD(it.dice);
      c.caps = (c.caps||0) + amt;
      granted.push(amt + ' Caps');
    }
    else if(it.t === 'ncrDollars'){
      const amt = (it.base||0) + rollCD(it.dice);
      c.ncrDollars = (c.ncrDollars||0) + amt;
      granted.push(amt + ' NCR Dollars');
    }
    else if(it.t === 'trinket'){
      const pick = TRINKETS[rollD20()-1];
      addMisc('Personal trinket: ' + pick, 1);
    }
    else if(it.t === 'outcastRoll'){
      const pick = rollOutcastEquipment();
      if(pick.t === 'weapon') addWeapon(pick.name);
      else if(pick.t === 'armor') addArmor(pick.name);
      else if(pick.t === 'chem') addChem(pick.name, 1);
      else addMisc(pick.name, 1);
    }
    else if(it.t === 'misc') addMisc(it.name, 1);
  });

  return {packName: pack.name, granted};
}
/* ==========================================================================
   CHARACTER CREATION WIZARD
   ========================================================================== */

let wizardState = null;

function openWizard(){
  wizardState = { draft: newCharacter('New Wanderer'), step: 0 };
  showModal(wizardModalHTML());
  renderWizardStep();
}
function wizardModalHTML(){
  return `
    <div class="modal-head"><h2>NEW CHARACTER</h2><button class="closex" onclick="closeModal()">✕</button></div>
    <div class="modal-body" id="wizardBody"></div>
    <div class="modal-foot">
      <button class="iconbtn" id="wizBackBtn" onclick="wizardNav(-1)">Back</button>
      <span style="flex:1"></span>
      <button class="iconbtn primary" id="wizNextBtn" onclick="wizardNav(1)">Next</button>
    </div>
  `;
}
function effectiveWizardSteps(){
  const o = getOrigin(wizardState.draft);
  const steps = ['name','origin','special','skills','perk'];
  if(o && o.traitPools && o.traitPools.length) steps.push('traits');
  steps.push('review');
  return steps;
}
function validateWizardStep(stepName){
  const draft = wizardState.draft;
  if(stepName === 'origin' && !draft.originId){ toast('Pick an origin to continue.'); return false; }
  return true;
}
function wizardNav(dir){
  const steps = effectiveWizardSteps();
  if(dir > 0 && !validateWizardStep(steps[wizardState.step])) return;
  const next = wizardState.step + dir;
  if(next < 0) return;
  if(next >= steps.length){ finishWizard(); return; }
  wizardState.step = next;
  renderWizardStep();
}
function renderWizardStep(){
  const steps = effectiveWizardSteps();
  if(wizardState.step >= steps.length) wizardState.step = steps.length-1;
  const stepName = steps[wizardState.step];
  const dots = `<div class="wizard-steps">${steps.map((s,i)=>`<div class="wizard-step-dot ${i<=wizardState.step?'done':''}"></div>`).join('')}</div>`;
  let content = '';
  switch(stepName){
    case 'name':    content = wizStepName(); break;
    case 'origin':  content = wizStepOrigin(); break;
    case 'special': content = wizStepSpecial(); break;
    case 'skills':  content = wizStepSkills(); break;
    case 'perk':    content = wizStepPerk(); break;
    case 'traits':  content = wizStepTraits(); break;
    case 'review':  content = wizStepReview(); break;
  }
  document.getElementById('wizardBody').innerHTML = dots + content;
  if(stepName === 'perk') wizardRenderPerkList('');
  if(stepName === 'traits') wizardRenderTraits();
  document.getElementById('wizBackBtn').disabled = wizardState.step === 0;
  document.getElementById('wizNextBtn').textContent = (wizardState.step === steps.length-1) ? 'Finish & Create' : 'Next';
}

  const draft = wizardState.draft;

    return `<div class="special-card">

        <button onclick="wizardAdjustSpecial('${a.key}',-1)">−</button>

      </div>
    </div>`;
  }).join('');
  return `

function wizardAdjustSpecial(key, delta){
  const draft = wizardState.draft;
  const bounds = specialBounds(draft, key);
  const val = draft.special[key] + delta;
  if(val < bounds.min || val > bounds.max) return;
  if(delta > 0 && specialPoolTotal(draft) >= SPECIAL_POOL_TARGET){ toast('No points left — lower another attribute first.'); return; }
  draft.special[key] = val;
  renderWizardStep();
}
function wizardApplyArray(name){
  const arr = ARRAYS[name];
  SPECIAL_ATTRS.forEach((a,i) => { wizardState.draft.special[a.key] = arr[i]; });
  renderWizardStep();
}

/* ---- Step: Skills ----------------------------------------------------------*/
function wizStepSkills(){
  const draft = wizardState.draft;
  const o = getOrigin(draft);
  const allowance = baseTagAllowance(draft);
  const tagCount = tagSkillCount(draft);
  const pool = skillPointPool(draft);
  const spent = skillPointsSpent(draft);
  const creationCap = draft.level >= 3 ? skillCap(draft) : Math.min(3, skillCap(draft));
  const extraChoiceHtml = (o && o.extraTagChoice) ? `
    <label class="field"><span class="flbl">Bonus tag skill — ${esc(o.traitName)}</span>
      <select onchange="setExtraTagChoice(this.value)">
        <option value="">— choose —</option>
        ${o.extraTagChoice.map(k => { const s = SKILLS.find(x=>x.key===k); return `<option value="${k}" ${draft.extraTagChoice===k?'selected':''}>${s.name}</option>`; }).join('')}
      </select>
    </label>` : '';
  const rows = SKILLS.map(s => {
    const rec = draft.skills[s.key];
    return `<div class="skill-row">
      <div class="skill-name"><input type="checkbox" ${rec.tag?'checked':''} onchange="wizardToggleTag('${s.key}')"> ${esc(s.name)} ${rec.tag?'<span class="tag-badge">TAG</span>':''}</div>
      <div class="skill-attr">${s.attr.toUpperCase()}</div>
      <div class="stepper"><button onclick="wizardAdjustSkillRank('${s.key}',-1)">−</button><span class="skill-rank-val">${rec.rank}</span><button onclick="wizardAdjustSkillRank('${s.key}',1)">+</button></div>
      <div class="skill-tn">TN ${specialFinalValue(draft,s.attr)+rec.rank}</div>
    </div>`;
  }).join('');
  return `
    <div class="panel-title">TAG SKILLS &amp; RANKS <span class="hint">${tagCount}/${allowance} tagged • ${spent}/${pool} pts • cap ${creationCap}</span></div>
    ${extraChoiceHtml}
    ${rows}
    <p class="empty-note">Pick ${allowance} tag skills (each starts at rank 2 free), then spend skill points on any skills up to the creation cap of ${creationCap}.</p>

}
function wizardToggleTag(key){
  const draft = wizardState.draft;
  const rec = draft.skills[key];
  if(!rec.tag){
    if(tagSkillCount(draft) >= baseTagAllowance(draft)){ toast('All tag skill slots are used.'); return; }
    rec.tag = true;
    if(rec.rank < 2) rec.rank = 2;
  } else {
    rec.tag = false;
  }
  renderWizardStep();
}
function wizardAdjustSkillRank(key, delta){
  const draft = wizardState.draft;
  const rec = draft.skills[key];
  const creationCap = draft.level >= 3 ? skillCap(draft) : Math.min(3, skillCap(draft));
  const baseline = rec.tag ? 2 : 0;
  let val = rec.rank + delta;
  if(val < baseline) val = baseline;
  if(val > creationCap) return;
  if(delta > 0 && skillPointsSpent(draft) >= skillPointPool(draft)){ toast('No skill points left to spend.'); return; }
  rec.rank = val;
  renderWizardStep();
}
function setExtraTagChoice(key){
  const draft = wizardState.draft;
  draft.extraTagChoice = key || null;
  if(key){
    draft.skills[key].tag = true;
    if(draft.skills[key].rank < 2) draft.skills[key].rank = 2;
  }
  renderWizardStep();
}

function finishWizard(){
  const draft = wizardState.draft;
  if(!draft.name || !draft.name.trim()) draft.name = 'Unnamed Wanderer';
  /* If the only character on the roster is still an untouched placeholder
     (e.g. the auto-created one on first run), replace it instead of piling
     a second blank entry into the roster. */
  if(DB.order.length === 1){
    const onlyId = DB.order[0];
    const only = DB.characters[onlyId];
    if(only && !only.originId && only.perks.length===0 && only.inventory.length===0 && !only.bio && !only.notes){
      delete DB.characters[onlyId];
      DB.order = [];
    }
  }
  const result = grantStartingEquipment(draft);
  DB.characters[draft.id] = draft;
  DB.order.push(draft.id);
  activeId = draft.id;
  setTheme(factionThemeForOrigin(draft.originId));
  persist();
  closeModal();
  renderAll();
  if(result && result.granted && result.granted.length){
    toast('Character created: ' + draft.name + ' \u2014 ' + result.packName + ' pack added to inventory.');

    toast('Character created: ' + draft.name);
