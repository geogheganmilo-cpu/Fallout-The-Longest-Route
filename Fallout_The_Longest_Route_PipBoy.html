/* ==========================================================================
   DICE ROLLER
   ========================================================================== */

let rollState = null;

function openRoller(skillKey){
  const c = current();
  skillKey = skillKey || SKILLS[0].key;
  const skillDef = SKILLS.find(s => s.key === skillKey);
  rollState = {
    skillKey, attrKey: skillDef.attr, difficulty: 1, bonusDice: 0,
    useLuck: false, assist: false, complicationRange: 1, results: null
  };
  showModal(rollerModalHTML());
  renderRoller();
}
function rollerModalHTML(){
  return `
    <div class="modal-head"><h2>SKILL TEST</h2><button class="closex" onclick="closeModal()">✕</button></div>
    <div class="modal-body" id="rollerBody"></div>
    <div class="modal-foot"><button class="iconbtn" onclick="closeModal()">Close</button></div>
  `;
}
function renderRoller(){
  const c = current();
  const body = document.getElementById('rollerBody');
  if(!body) return;
  const rec = c.skills[rollState.skillKey];
  const attrKey = rollState.useLuck ? 'lck' : rollState.attrKey;
  const target = specialFinalValue(c, attrKey) + rec.rank;
  const isTag = rec.tag;
  const totalDice = rollState.assist ? 1 : (2 + rollState.bonusDice);
  const apCost = rollState.assist ? 0 : BONUS_DIE_COST[rollState.bonusDice];
  const lCur = luckCurrent(c);

  body.innerHTML = `
    <label class="field"><span class="flbl">Skill</span>
      <select onchange="rollerSetSkill(this.value)">
        ${SKILLS.map(s => `<option value="${s.key}" ${s.key===rollState.skillKey?'selected':''}>${s.name}${c.skills[s.key].tag?' ★':''}</option>`).join('')}
      </select>
    </label>
    <div class="field-row">
      <label class="field"><span class="flbl">Attribute</span>
        <select onchange="rollerSetAttr(this.value)" ${rollState.useLuck?'disabled':''}>
          ${SPECIAL_ATTRS.filter(a=>a.key!=='lck').map(a => `<option value="${a.key}" ${a.key===rollState.attrKey?'selected':''}>${a.name}</option>`).join('')}
        </select>
      </label>
      <label class="field"><span class="flbl">Difficulty</span>
        <div class="stepper"><button onclick="rollerAdjustDiff(-1)">−</button><span class="num-display" style="font-size:20px;">${rollState.difficulty}</span><button onclick="rollerAdjustDiff(1)">+</button></div>
      </label>
    </div>
    <div class="checkline"><input type="checkbox" ${rollState.useLuck?'checked':''} ${lCur<1?'disabled':''} onchange="rollerToggleLuckAttr(this.checked)"> Stacked Deck: use LCK instead (costs 1 Luck, ${lCur} available)</div>
    <div class="checkline"><input type="checkbox" ${rollState.assist?'checked':''} onchange="rollerToggleAssist(this.checked)"> Assisting another character (1d20 only, no bought dice)</div>

    <div class="roll-summary">TARGET ${target}${isTag?' ★ TAG (crit on ≤'+rec.rank+')':''} &nbsp;•&nbsp; POOL ${totalDice}d20</div>

    <div class="small-caps">Complication range</div>
    <div class="dice-buy-row">
      ${[1,2,3,4,5].map(n => `<button class="dice-buy-btn ${rollState.complicationRange===n?'selected':''}" onclick="rollerSetCompRange(${n})">${COMPLICATION_RANGE_TABLE[n].join('–')}</button>`).join('')}
    </div>

    <div class="small-caps">Buy bonus d20s with Action Points (Party pool: ${c.apPool})</div>
    <div class="dice-buy-row">
      ${[0,1,2,3].map(n => {
        const cost = BONUS_DIE_COST[n];
        const can = rollState.assist ? n===0 : (c.apPool >= cost);
        return `<button class="dice-buy-btn ${rollState.bonusDice===n?'selected':''}" ${can?'':'disabled'} onclick="rollerSetBonusDice(${n})">${n===0?'Base 2d20':`+${n}d20 (${cost} AP)`}</button>`;
      }).join('')}
    </div>

    <button class="iconbtn primary" style="width:100%; margin-top:12px; font-size:15px; padding:11px;" onclick="performRoll()">ROLL ${totalDice}d20</button>

    <div id="rollResults">${rollState.results ? renderRollResults() : ''}</div>
  `;
}
function rollerSetSkill(key){
  const c = current();
  rollState.skillKey = key;
  rollState.attrKey = SKILLS.find(s => s.key===key).attr;
  rollState.useLuck = false;
  rollState.results = null;
  renderRoller();
}
function rollerSetAttr(key){ rollState.attrKey = key; renderRoller(); }
function rollerAdjustDiff(delta){ rollState.difficulty = clamp(0, 10, rollState.difficulty + delta); renderRoller(); }
function rollerToggleLuckAttr(v){ rollState.useLuck = v; renderRoller(); }
function rollerToggleAssist(v){ rollState.assist = v; if(v) rollState.bonusDice = 0; renderRoller(); }
function rollerSetCompRange(n){ rollState.complicationRange = n; renderRoller(); }
function rollerSetBonusDice(n){ rollState.bonusDice = n; renderRoller(); }

function rollOneDie(target, tagThreshold, compSet){
  const roll = 1 + Math.floor(Math.random()*20);
  let successes = 0, crit = false;
  if(roll === 1 || (tagThreshold > 0 && roll <= tagThreshold)){ successes = 2; crit = true; }
  else if(roll <= target){ successes = 1; }
  const complication = compSet.has(roll);
  return {roll, successes, crit, complication};
}
function summarizeRoll(dice, difficulty){
  const successes = dice.reduce((s,d) => s+d.successes, 0);
  const complications = dice.filter(d => d.complication).length;
  const passed = successes >= difficulty;
  const bonusAP = passed ? Math.max(0, successes - difficulty) : 0;
  return {dice, successes, complications, passed, bonusAP, difficulty};
}
function performRoll(){
  const c = current();
  const attrKey = rollState.useLuck ? 'lck' : rollState.attrKey;
  const rec = c.skills[rollState.skillKey];
  const target = specialFinalValue(c, attrKey) + rec.rank;
  const totalDice = rollState.assist ? 1 : (2 + rollState.bonusDice);
  const apCost = rollState.assist ? 0 : BONUS_DIE_COST[rollState.bonusDice];
  if(apCost > c.apPool){ toast('Not enough Party AP for that many bonus dice.'); return; }
  if(rollState.useLuck){
    if(luckCurrent(c) < 1){ toast('No Luck points left.'); return; }
    c.luckSpent = (c.luckSpent||0) + 1;
  }
  c.apPool -= apCost;
  const compSet = new Set(COMPLICATION_RANGE_TABLE[rollState.complicationRange]);
  const dice = [];
  for(let i=0;i<totalDice;i++) dice.push(rollOneDie(target, rec.tag ? rec.rank : 0, compSet));
  rollState.results = summarizeRoll(dice, rollState.difficulty);
  renderAll();
  renderRoller();
}
function renderRollResults(){
  const r = rollState.results;
  const diceHtml = r.dice.map((d,idx) => {
    let cls = d.successes > 0 ? 'success' : 'fail';
    if(d.crit) cls = 'crit';
    if(d.complication) cls += ' complication';
    return `<div class="die ${cls}" onclick="rerollDie(${idx})" title="Spend 1 Luck to re-roll">${d.roll}${d.complication?'<span class="tag" style="color:var(--red);">COMP</span>':''}</div>`;
  }).join('');
  return `
    <div class="diebox">${diceHtml}</div>
    <div class="roll-summary ${r.passed?'pass':'fail'}">
      ${r.successes} success${r.successes===1?'':'es'} vs difficulty ${r.difficulty} — ${r.passed?'PASS':'FAIL'}
      ${r.complications ? `<br><span style="color:var(--red); font-size:13px;">${r.complications} complication(s) triggered</span>` : ''}
    </div>
    ${r.passed && r.bonusAP > 0 ? `<button class="iconbtn primary" onclick="bankBonusAP(${r.bonusAP})">+ Add ${r.bonusAP} AP to Party Pool</button>` : ''}
    <div class="small-caps" style="margin-top:8px;">Click a die to spend 1 Luck and re-roll it (${luckCurrent(current())} available).</div>
  `;
}
function rerollDie(idx){
  const c = current();
  if(luckCurrent(c) < 1){ toast('No Luck left.'); return; }
  c.luckSpent = (c.luckSpent||0) + 1;
  const attrKey = rollState.useLuck ? 'lck' : rollState.attrKey;
  const rec = c.skills[rollState.skillKey];
  const target = specialFinalValue(c, attrKey) + rec.rank;
  const compSet = new Set(COMPLICATION_RANGE_TABLE[rollState.complicationRange]);
  rollState.results.dice[idx] = rollOneDie(target, rec.tag ? rec.rank : 0, compSet);
  rollState.results = summarizeRoll(rollState.results.dice, rollState.results.difficulty);
  renderAll();
  renderRoller();
}
function bankBonusAP(n){
  const c = current();
  c.apPool = Math.min(6, c.apPool + n);
  toast('+' + n + ' AP added to the party pool.');
  renderAll();
  renderRoller();
}
/* ==========================================================================
   INIT
   ========================================================================== */
document.addEventListener('DOMContentLoaded', () => {
  loadDB();
  loadTheme();

  document.getElementById('importBtn').addEventListener('click', () => document.getElementById('importFile').click());
  document.getElementById('importFile').addEventListener('change', handleImportFile);

  const c = current();
  const isFreshInstall = DB.order.length === 1 && c && !c.originId && c.perks.length === 0 && c.inventory.length === 0;

  renderAll();

  if(isFreshInstall){
    setTimeout(() => openWizard(), 350);
  }
});
</script>
